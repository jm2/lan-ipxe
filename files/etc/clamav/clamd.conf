# ClamAV daemon for clamav-daemon.service, managed by setup-arch-workstation.sh
# (installed as /etc/clamav/clamd.conf; see clamd.conf(5)). The socket path
# must match clamav-daemon.socket, which activates this daemon. LogSyslog is
# preferred over the upstream LogFile so detections land in the journal next
# to clamonacc's output.
#
# clamav-clamonacc.service reads the OnAccess* options and passes each event's
# file descriptor to this daemon (--fdpass), which lets the unprivileged clamav
# user scan files inside 0700 home directories.
#
# The watched directories are NOT here: clamd.conf has no glob support for
# OnAccessIncludePath, so setup-arch-workstation.sh appends one
# OnAccessIncludePath line per human user's ~/Downloads at apply time (the
# coverage decision is Downloads-only; the DDD on-access system cannot follow
# mounts created later, so USB media is handled by clamav-media-scan.path
# instead). --check compares the destination against the same rendering.

LogSyslog yes
LogTime yes
ExtendedDetectionInfo yes
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp

LocalSocket /run/clamav/clamd.ctl

User clamav

ExcludePath ^/proc/
ExcludePath ^/sys/

# On-access scanning, notify-only: detections are logged to the journal
# (journalctl -u clamav-clamonacc) but access is never blocked, so a false
# positive or a saturated scanner cannot stall builds or the desktop.
# OnAccessExtraScanning also scans files as soon as they are closed after
# writing or moved into place, so a finished download is checked without
# having to be opened again. OnAccessExcludeUname keeps the clamd user's own
# scans (including the fdpass reads for the media scanner) from retriggering
# the watch.
OnAccessExcludeUname clamav
OnAccessPrevention no
OnAccessExtraScanning yes
