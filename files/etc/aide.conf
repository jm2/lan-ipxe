# AIDE configuration, installed as /etc/aide.conf by
# setup-{fedora,arch}-workstation.sh. AIDE 0.19 syntax: assignments take no
# spaces around '=' and the new database directive is 'database_out' (the
# pre-0.17 name was 'database_new').
#
# Scope decision: this is a *configuration* integrity baseline, not a
# whole-filesystem one. Package-owned trees (/usr, /boot, ...) change on every
# nightly update (dnf5-automatic on Fedora, the /etc/cron.daily/pacman-update
# job on Arch), which would either bury real findings in noise or force a
# re-baseline after every update job - and re-baselining right after an update
# is exactly when an attacker's change would be absorbed. The package managers
# already verify their own trees on demand (rpm -Va, pacman -Qkk), so AIDE
# watches what they cannot vouch for:
#   /etc        every system configuration vector (with churn exclusions)
#   /usr/local  locally installed software (this repo's helper scripts etc.)
#   /root       root's configuration and dotfiles (cache excluded)
# The database is deliberately NOT auto-updated; review `aide --check` output
# first and refresh consciously with `aide --update` plus the move below, so a
# real change can never be silently re-baselined by a timer.

database_in=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
gzip_dbout=yes

# Warnings and findings only; the daily aide-check.service unit captures the
# report in the journal via stdout.
log_level=warning
report_url=stdout

# Attributes: permissions, ownership, link count, size and content digest.
FIM=p+u+g+n+s+sha256+ftype

/etc FIM
# Volatile or regenerated files under /etc: excluding them keeps the daily
# check signal clean (NetworkManager rewrites resolv.conf; ldconfig rewrites
# its cache; mtab is a runtime symlink; CA bundles are regenerated by their
# packages, which verify them anyway).
!/etc/mtab
!/etc/resolv.conf
!/etc/ld.so.cache
!/etc/pki/ca-trust/extracted
!/etc/ssl/certs

/usr/local FIM

/root FIM
!/root/.cache
