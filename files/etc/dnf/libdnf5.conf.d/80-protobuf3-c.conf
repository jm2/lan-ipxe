# Managed by setup-fedora-workstation.sh. Fedora 45's protobuf3-c compat
# package declares "Obsoletes: protobuf-c < 1.5.2-52" although protobuf-c
# 1.5.2-5 is the current library, so an unrestricted upgrade (including the
# nightly dnf5-automatic run) replaces protobuf-c on both x86_64 and i686 and
# leaves protobuf-c-devel uninstallable. Hide the compat package from every
# DNF transaction until Fedora fixes the obsolete; nothing in the workstation
# package set requires it.
[main]
excludepkgs=protobuf3-c*
