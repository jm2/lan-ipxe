# Managed by setup-arch-workstation.sh. Replaces the packaged command, which
# quarantines detections into /root/quarantine, with notify-only scanning:
# detections land in the journal, file descriptors are passed to the
# unprivileged clamd (--fdpass), and clamonacc waits for the socket-activated
# daemon to finish loading signatures before watching.
[Service]
ExecStart=
ExecStart=clamonacc --foreground --fdpass --wait --config-file=/etc/clamav/clamd.conf
Restart=on-failure
RestartSec=30s
