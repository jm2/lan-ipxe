# Managed by setup-fedora-workstation.sh. Keeps clamonacc in the foreground so
# detections land in the journal, passes file descriptors to the unprivileged
# clamd (--fdpass), waits for clamd to answer before watching, and ties the
# scanner's lifetime to clamd@scan.
[Unit]
Requires=clamd@scan.service
After=clamd@scan.service

[Service]
ExecStart=
ExecStart=clamonacc --foreground --fdpass --wait --config-file=/etc/clamd.d/scan.conf
Restart=on-failure
RestartSec=30s
