name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Discover and lint every Bash file
        run: tests/lint-bash.sh

  shell-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq systemd-zram-generator
      - name: Run mocked Linux setup behavior tests
        run: |
          tests/test-controller-release-updates.sh
          tests/test-antigravity-migration.sh
          tests/test-workstation-shell-helpers.sh
          tests/test-pacman-update.sh
          tests/test-zram-generator.sh

  powershell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      - name: Parse and analyze every PowerShell file
        shell: pwsh
        run: ./tests/Test-PowerShellStatic.ps1
      - name: Run PowerShell unit tests
        shell: pwsh
        run: |
          ./catalogscrape/Test-CatalogScrape.ps1
          ./tests/Test-HyperV.ps1
          ./tests/Test-WingetAntigravity.ps1
          ./tests/Test-WingetInventory.ps1

  windows-powershell-51:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse workstation scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, found $($PSVersionTable.PSVersion)"
          }
          $files = @(
            'setup-win11-workstation.ps1'
            'enable-openssh-win11.ps1'
            'enable-hyperv-win11.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              throw "$file has Windows PowerShell 5.1 parser errors: $($errors -join '; ')"
            }
          }
      - name: Run workstation tests with Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/Test-HyperV.ps1
          ./tests/Test-WingetAntigravity.ps1
          ./tests/Test-WingetInventory.ps1
