name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # The scrape helpers rely on pipeline exit semantics; -e/pipefail are
          # intentional design choices, so we lint at warning severity.
          shellcheck -S warning \
            update-pxe-images.sh \
            build_archiso.sh \
            mlnx-fw-flash-update.sh \
            files/etc/cron.daily/pacman-update

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer found errors"
            exit 1
          }

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workstation manifests parse
        run: |
          python3 - <<'PY'
          import glob, yaml, sys
          ok = True
          for f in glob.glob("*_workstation.yaml"):
              try:
                  yaml.safe_load(open(f))
                  print(f"OK  {f}")
              except Exception as e:
                  ok = False
                  print(f"FAIL {f}: {e}")
          sys.exit(0 if ok else 1)
          PY
