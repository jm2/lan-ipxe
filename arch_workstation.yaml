where: os.name == "linux"
actions:
- action: command.run
  privileged: true
  command: bash
  args:
  - -c
  - pacman -Q jre-openjdk &>/dev/null && pacman -Rdd --noconfirm jre-openjdk || true
# Enable the [multilib] repo BEFORE installing any lib32-* / steam packages.
# Idempotent: only edits pacman.conf and re-syncs if multilib isn't already enabled.
- action: command.run
  privileged: true
  command: bash
  args:
  - -c
  - 'pacman-conf --repo-list 2>/dev/null | grep -qx multilib || { sed -i "/^#\[multilib\]$/{N;s/^#\[multilib\]\n#Include/[multilib]\nInclude/}" /etc/pacman.conf; pacman -Sy --noconfirm; }'
- action: package.install
  list:
  - base-devel
  - bash-completion
  - bash-preexec
  - bison
  - bluez
  - bluez-utils
  - boost
  - brasero
  - cantarell-fonts
  - ccache
  - chrony
  - clang
  - chromium
  - cmake
  - colordiff
  - cronie
  - cups
  - cups-pk-helper
  - dos2unix
  - dracut
  - efibootmgr
  - erofs-utils
  - flex
  - gcc
  - gdb
  - git
  - github-cli
  - gmp
  - gnome
  - gnome-circle
  - gnome-extra
  - gnome-firmware
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-dash-to-panel
  - gnome-shell-extension-desktop-icons-ng
  - gnome-shell-extension-vitals
  - gnome-shell-extensions
  - go
  - gparted
  - gradle
  - grub
  - gst-plugin-pipewire
  - gst-plugins-ugly
  - hivex
  - htop
  - intel-ucode
  - less
  - lib32-libva-intel-driver
  - lib32-vulkan-asahi
  - lib32-vulkan-broadcom
  - lib32-vulkan-dzn
  - lib32-vulkan-freedreno
  - lib32-vulkan-gfxstream
  - lib32-vulkan-intel
  - lib32-vulkan-kosmickrisp
  - lib32-vulkan-nouveau
  - lib32-vulkan-panfrost
  - lib32-vulkan-powervr
  - lib32-vulkan-radeon
  - lib32-vulkan-swrast
  - lib32-vulkan-virtio
  - libmpc
  - libpulse
  - libva-intel-driver
  - libva-nvidia-driver
  - libva-utils
  - linux
  - linux-firmware
  - linux-headers
  - linux-lts
  - linux-lts-headers
  - lldb
  - llvm
  - lutris
  - maven
  - mesa-utils
  - mpfr
  - mpv
  - nano
  - net-tools
  - networkmanager
  - noto-fonts
  - noto-fonts-cjk
  - noto-fonts-extra
  - nvidia-open
  - nvidia-utils
  - ollama-cuda
  - ollama-vulkan
  - opencl-mesa
  - pacman-contrib
  - pipewire
  - pipewire-alsa
  - pipewire-jack
  - pipewire-pulse
  - power-profiles-daemon
  - ptyxis
  - rpm-tools
  - rsync
  - ruby
  - rust
  - screen
  - seahorse
  - sof-firmware
  - steam
  - sudo
  - system-config-printer
  - texinfo
  - tree
  - vim
  - vlc
  - vulkan-devel
  - vulkan-intel
  - vulkan-mesa-layers
  - vulkan-radeon
  - wget
  - wireplumber
  - wpa_supplicant
  - yt-dlp
  - zram-generator
- action: command.run
  command: bash
  args:
  - -c
  - if ! command -v yay &> /dev/null; then sudo pacman -S --needed --noconfirm git
    base-devel && git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin &&
    cd /tmp/yay-bin && makepkg -si --noconfirm && rm -rf /tmp/yay-bin; fi
- action: package.install
  provider: yay
  list:
  - airshipper
  - android-ndk
  - android-sdk-build-tools
  - android-sdk-cmdline-tools-latest
  - android-sdk-platform-tools
  - android-studio
  - antigravity
  - bugdom
  - bugdom2
  - cdrtools # AUR: provides genisoimage/mkisofs (Fedora genisoimage equivalent)
  - claude-code
  - comtrya
  - cro-mag-rally-net
  - downgrade
  - dxvk-bin
  - gnome-icon-theme
  - gnome-icon-theme-symbolic
  - gnome-shell-extension-dash-to-dock
  - google-chrome
  - hfsutils
  - lgogdownloader
  - lineageos-devel
  - luxtorpeda-bin
  - maelstrom
  - makemkv
  - maniadrive
  - mightymike
  - mstflint
  - nanosaur
  - nanosaur2
  - ookla-speedtest-bin
  - openarena
  - ottomatic
  - payload-dumper-go-bin
  - powershell-bin
  - sit-git
  - steamcmd
  - tremulous-grangerhub-bin
  - tributary-bin
  - tuxracer
  - unarchiver # AUR: provides unar/lsar (moved here from the official list; not in repos)
  - unigine-heaven
  - ventoy-bin
  - video-downloader
  - vscodium-bin
- action: file.copy
  source: bashrc
  target: "{{ env.HOME }}/.bashrc"
- action: file.copy
  source: vimrc
  target: "{{ env.HOME }}/.vimrc"
# NOTE: must run from repo root (repo-relative source path)
- action: command.run
  privileged: true
  command: cp
  args:
  - files/grub
  - /etc/default/grub
# Regenerate grub.cfg so the /etc/default/grub changes actually take effect.
- action: command.run
  privileged: true
  command: grub-mkconfig
  args:
  - -o
  - /boot/grub/grub.cfg
# NOTE: must run from repo root (repo-relative source path)
- action: command.run
  privileged: true
  command: cp
  args:
  - files/etc/bash.bashrc
  - /etc/bash.bashrc
# - action: command.run
#   privileged: true
#   command: cp
#   args:
#   - files/etc/pacman.conf
#   - /etc/pacman.conf
# NOTE: must run from repo root (repo-relative source path)
- action: command.run
  privileged: true
  command: cp
  args:
  - files/etc/locale.conf
  - /etc/locale.conf
# NOTE: must run from repo root (repo-relative source path)
- action: command.run
  privileged: true
  command: bash
  args:
  - -c
  - mkdir -p /etc/sysctl.d && cp files/etc/sysctl.d/99-inotify.conf /etc/sysctl.d/99-inotify.conf
# NOTE: must run from repo root (repo-relative source path)
- action: command.run
  privileged: true
  command: cp
  args:
  - files/etc/cron.daily/pacman-update
  - /etc/cron.daily/pacman-update
- action: command.run
  privileged: true
  command: ln
  args:
  - -sf
  - /usr/bin/vim
  - /usr/bin/vi
- action: command.run
  privileged: true
  command: bash
  args:
  - -c
  - pacman -Q mkinitcpio &>/dev/null && pacman -Rsn --noconfirm mkinitcpio || true
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - bluetooth.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - chronyd.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - cronie.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - cups.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - gdm.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - gnome-remote-desktop.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - NetworkManager-dispatcher.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - NetworkManager-wait-online.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - NetworkManager.service
- action: command.run
  privileged: true
  command: systemctl
  args:
  - enable
  - sshd.service
- action: command.run
  privileged: true
  command: bash
  args:
  - -c
  - '[ -f "{{ env.HOME }}/.config/monitors.xml" ] && cp "{{ env.HOME }}/.config/monitors.xml" /etc/xdg/monitors.xml || true'
- action: command.run
  privileged: true
  command: bash
  args:
  - -c
  - mkdir -p /etc/dconf/db/gdm.d
# NOTE: must run from repo root (repo-relative source path)
- action: command.run
  privileged: true
  command: cp
  args:
  - files/etc/dconf/db/gdm.d/10-font-settings
  - /etc/dconf/db/gdm.d/10-font-settings
- action: command.run
  privileged: true
  command: dconf
  args:
  - update
